# Cloudflare Pages project: static SPA + Pages Functions (same-origin /api).
# Legacy Worker remains in api/wrangler.toml (averie-cook-api.workers.dev).
#
# Bind the EXISTING D1 + MEDIA KV — do not create a second empty database.
name = "hehejojo-eat"
compatibility_date = "2026-09-17"
pages_build_output_dir = "./web/dist"

[[d1_databases]]
binding = "DB"
database_name = "averie-cook"
database_id = "b05980b7-5117-428f-9347-a2e5c649afa5"
migrations_dir = "api/migrations"

[[kv_namespaces]]
binding = "MEDIA"
id = "8d276e34e2944f18800074735ffaba8b"

[vars]
# Canonical static origin. Pages Functions also swap to the request origin
# when the host is *.pages.dev (preview deployments).
ASSET_BASE_URL = "https://hehejojo-eat.pages.dev"
ENVIRONMENT = "production"

# Secrets (never commit values). Reuse the same values as averie-cook-api:
#   npx wrangler pages secret put OWNER_PASSWORD --project-name averie-cook
#   npx wrangler pages secret put OWNER_SESSION_SECRET --project-name averie-cook
#   npx wrangler pages secret put INGEST_SECRET --project-name averie-cook
