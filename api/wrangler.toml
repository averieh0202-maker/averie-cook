# Legacy Worker (workers.dev). Canonical public site + API is Cloudflare Pages:
# see the repo-root wrangler.toml (project averie-cook, same-origin /api).
name = "averie-cook-api"
main = "src/index.ts"
compatibility_date = "2026-09-17"

# Replace database_id after: npx wrangler d1 create averie-cook
[[d1_databases]]
binding = "DB"
database_name = "averie-cook"
database_id = "b05980b7-5117-428f-9347-a2e5c649afa5"
migrations_dir = "migrations"

# Local wrangler simulates this namespace. Before remote deploy:
#   npx wrangler kv namespace create MEDIA
# then paste the real id here.
[[kv_namespaces]]
binding = "MEDIA"
id = "8d276e34e2944f18800074735ffaba8b"

# Optional R2 mirror for covers:
#   npx wrangler r2 bucket create averie-cook-covers
# [[r2_buckets]]
# binding = "COVERS"
# bucket_name = "averie-cook-covers"

[[rules]]
type = "Data"
globs = ["**/*.jpg", "**/*.bin"]
fallthrough = true

[vars]
ASSET_BASE_URL = "https://averieh0202-maker.github.io/averie-cook"
ENVIRONMENT = "production"

# Secrets (never commit values):
#   npx wrangler secret put OWNER_PASSWORD
#   npx wrangler secret put OWNER_SESSION_SECRET
#   npx wrangler secret put INGEST_SECRET
